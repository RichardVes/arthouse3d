<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Amostras - Arte House 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAF8F5;
            --bg-secondary: #F2EEE9;
            --bg-card: #FFFFFF;
            --accent: #D9A3B1;
            --accent-gradient: linear-gradient(135deg, #D9A3B1 0%, #BF9FA7 100%);
            --text-main: #3F403C;
            --text-muted: #7A7872;
            --border: #E6E1DA;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--accent-gradient);
        }
        .logo-container img {
            max-height: 80px;
            margin-bottom: 1rem;
            border-radius: 8px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }
        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #e1306c;
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .social-link:hover { opacity: 0.9; }
        
        .filters {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: var(--bg-secondary);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .category-section {
            margin-bottom: 4rem;
        }
        .category-header {
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
        }
        .category-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-main);
        }
        .category-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
        }
        .card-img-wrapper {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background: #111;
            cursor: pointer;
            position: relative;
        }
        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .card-img-wrapper:hover img {
            transform: scale(1.05);
        }
        .card-body {
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .card-meta {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .card-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-weight: 500;
        }
        .card-id-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-weight: 600;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .lightbox-close {
            position: absolute;
            top: 20px; right: 30px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            background: none;
            border: none;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            padding: 2rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-container">
                <img src="logo.png" alt="Arte House 3D Logo" onerror="this.style.display='none'">
            </div>
            <h1>Arte House 3D</h1>
            <p class="subtitle">Catálogo de Amostras & Produtos de Impressão 3D</p>
            <a href="https://www.instagram.com/artehouse3d" target="_blank" class="social-link">
                📸 Instagram @artehouse3d
            </a>
        </header>

        <div class="filters" id="filters-container">
            <button class="filter-btn active" onclick="filterCat('all')">Todos os Produtos</button>
        </div>

        <div id="catalog-content">
            <!-- Dinâmico via localStorage -->
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close">&times;</button>
        <img id="lightbox-img" src="" alt="Ampliada">
    </div>

    <script>
        let catalogData = JSON.parse(localStorage.getItem('artehouse_catalog')) || [
            { id: "PK-01", name: "Bulbasaur Vaso / Cachepô", category: "pokemon", path: "bulba/WhatsApp Image 2026-09-30 at 10.04.58.jpeg" },
            { id: "PK-02", name: "Gengar 3D", category: "pokemon", path: "gengar/WhatsApp Image 2026-09-30 at 10.04.44.jpeg" },
            { id: "PK-03", name: "Jolteon Eeveelution", category: "pokemon", path: "jolteon/WhatsApp Image 2026-09-30 at 10.04.50.jpeg" },
            { id: "AR-01", name: "Asas Articuladas", category: "articulados", path: "ala/WhatsApp Image 2026-09-30 at 14.06.30.jpeg" }
        ];

        let categories = JSON.parse(localStorage.getItem('artehouse_cats')) || {
            "pokemon": "Pokémon & Geeks",
            "articulados": "Articulados & Asas",
            "diversos": "Vitrine & Outros Produtos"
        };

        let currentFilter = 'all';

        function renderCatalog() {
            const filtersContainer = document.getElementById('filters-container');
            filtersContainer.innerHTML = `<button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="filterCat('all')">Todos os Produtos</button>`;
            
            for(const [catId, catTitle] of Object.entries(categories)) {
                filtersContainer.innerHTML += `<button class="filter-btn ${currentFilter === catId ? 'active' : ''}" onclick="filterCat('${catId}')">${catTitle}</button>`;
            }

            const contentContainer = document.getElementById('catalog-content');
            contentContainer.innerHTML = '';

            for(const [catId, catTitle] of Object.entries(categories)) {
                if(currentFilter !== 'all' && currentFilter !== catId) continue;

                const items = catalogData.filter(item => item.category === catId);
                if(items.length === 0 && currentFilter === 'all') continue;

                let gridHTML = `
                    <section class="category-section" data-category="${catId}">
                        <div class="category-header">
                            <h2 class="category-title">${catTitle}</h2>
                            <p class="category-desc">Produtos e amostras da categoria ${catTitle}</p>
                        </div>
                        <div class="grid">
                `;

                if(items.length === 0) {
                    gridHTML += `<p style="color: var(--text-muted); grid-column: 1/-1;">Nenhum produto cadastrado nesta categoria ainda.</p>`;
                } else {
                    items.forEach(item => {
                        gridHTML += `
                            <div class="card">
                                <div class="card-img-wrapper" onclick="openLightbox('${item.path}')">
                                    <img src="${item.path}" alt="${item.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/260x220?text=3D+Arte+House'">
                                </div>
                                <div class="card-body">
                                    <div>
                                        <div class="card-meta">
                                            ${item.id ? `<span class="card-id-badge">${item.id}</span>` : ''}
                                            <span class="card-badge">${catTitle}</span>
                                        </div>
                                        <h3 class="card-title" style="margin-top: 0.5rem;">${item.name}</h3>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                gridHTML += `</div></section>`;
                contentContainer.innerHTML += gridHTML;
            }
        }

        function filterCat(cat) {
            currentFilter = cat;
            renderCatalog();
        }

        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        renderCatalog();
    </script>
</body>
</html>
